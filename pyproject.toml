[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "termswitch"
dynamic = ["version"]
description = "termSwitch: grouped AWS profiles that open authenticated terminals"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
authors = [{ name = "Mike Roughton" }]
dependencies = [
    "PySide6-Essentials>=6.6",
    "configupdater>=3.1",
    "pyte>=0.8.2",
    "ptyprocess>=0.7; sys_platform != 'win32'",
    "pywinpty>=2.0.14; sys_platform == 'win32'",
]

[project.gui-scripts]
termswitch = "termswitch.__main__:main"

[project.scripts]
# Console entry point, handy for `tsw --check`.
tsw = "termswitch.__main__:main"

[tool.setuptools]
packages = ["termswitch"]

[tool.setuptools.dynamic]
version = {attr = "termswitch.BASE_VERSION"}

[tool.setuptools.package-data]
termswitch = ["assets/*", "assets/icons/material/*", "assets/icons/termswitch/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
