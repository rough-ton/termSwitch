name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: No attribution text in commits or files
        run: python3 tools/check_attribution.py --commits --files

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock -r requirements-dev.lock
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -X faulthandler -m pytest -q 2>&1 | tee pytest-output.txt
        timeout-minutes: 10
      # A crash (for example a segfault at exit) produces no failing test, so put
      # the end of the output in an annotation where it can be read from the PR.
      - name: Report the test output
        if: failure()
        shell: bash
        run: |
          tail -n 40 pytest-output.txt | python -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\r', '').replace('\n', '%0A'); print('::error title=pytest output (last 40 lines)::' + t)"
