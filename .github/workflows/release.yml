name: Release

# - Push to main (every merged PR): build the Windows and macOS downloads and
#   publish them as a new versioned release. The version is BASE_VERSION's
#   MAJOR.MINOR with the next free patch number (tools/next_version.py), and
#   is stamped into the app.
# - Run it by hand (Actions > Release > Run workflow): build the downloads as
#   run artifacts only, without publishing anything.
# - Windows signing: when the SIGNPATH_ORGANIZATION_ID repository variable is
#   set, the Windows build is signed for free by SignPath Foundation, verified
#   on Windows, and only then published. A signing failure stops the release.
#   Unset, releases are unsigned as before. Setup: docs/releasing.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Releases from main run one at a time, so two quick merges never pick the
# same version. They are queued, not cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # tags are needed to find the next patch number
      - id: v
        run: |
          version=$(python3 tools/next_version.py)
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::Tag v${version} already exists"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Next release: v${version}"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: termSwitch-windows-x64.exe
          - os: macos-latest
            artifact: termSwitch-macos-arm64.dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write        # build provenance attestation
      attestations: write
    env:
      # The Windows build goes to SignPath first; see the sign-windows job.
      SIGN_WINDOWS: ${{ matrix.os == 'windows-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Stamp the release version
        shell: bash
        run: |
          {
            echo "__version__ = \"${{ needs.version.outputs.version }}\""
            echo "__commit__ = \"${GITHUB_SHA::7}\""
          } > termswitch/_version.py
          python -c "import termswitch as t; print('Building termSwitch', t.__version__, t.__commit__)"

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock -r requirements-build.lock

      - name: Build
        run: pyinstaller --noconfirm --clean termswitch.spec

      - name: Package and smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/${{ matrix.artifact }}"
          Move-Item dist/termSwitch.exe $out
          $p = Start-Process -FilePath $out -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "termSwitch --version exited $($p.ExitCode)" }
          # Informational: the runner has no AWS config, so warnings are expected.
          Start-Process -FilePath $out -ArgumentList '--check','--offline' -Wait -NoNewWindow
          Get-Item $out | Select-Object Name, Length

      - name: Package and smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          app=dist/termSwitch.app
          "$app/Contents/MacOS/termSwitch" --version | tee /dev/stderr \
            | grep -qF "termSwitch ${{ needs.version.outputs.version }}"
          "$app/Contents/MacOS/termSwitch" --check --offline || true
          codesign --verify --deep --strict "$app" || echo "::warning::codesign verification failed"
          mkdir dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname termSwitch -srcfolder dmg -ov -format UDZO "dist/${{ matrix.artifact }}"
          ls -l "dist/${{ matrix.artifact }}"

      - name: Attest build provenance
        # Attestations need a public repo (or GitHub Enterprise Cloud for private).
        # A file sent for signing is attested after signing instead.
        if: ${{ !github.event.repository.private && env.SIGN_WINDOWS != 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # "unsigned-..." never reaches the release; publish only takes termSwitch-*.
          name: ${{ env.SIGN_WINDOWS == 'true' && format('unsigned-{0}', matrix.artifact) || matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  sign-windows:
    # Free code signing for open source projects: SignPath.io, certificate by
    # SignPath Foundation. Every job before the signing request runs on
    # GitHub-hosted runners, as SignPath requires. The request waits for a
    # manual approval in SignPath, so it waits here on Linux, the cheapest runner.
    needs: [version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    environment: release     # holds SIGNPATH_API_TOKEN; limited to main
    permissions:
      actions: read          # find and fetch the unsigned build
      contents: read
    steps:
      - name: Find the unsigned Windows build
        id: unsigned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                 --jq '.artifacts[] | select(.name == "unsigned-termSwitch-windows-x64.exe") | .id')
          if [ -z "$id" ]; then echo "::error::The unsigned Windows build was not found"; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Sign with SignPath (waits for approval)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'termSwitch' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-termSwitch-windows-x64.exe
          path: signed/termSwitch-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  verify-windows:
    # Check the signature on Windows before anything is published.
    needs: [version, sign-windows]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write        # build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-termSwitch-windows-x64.exe
          path: dist

      - name: Verify the signature and smoke test
        shell: pwsh
        run: |
          $exe = "dist/termSwitch-windows-x64.exe"
          $sig = Get-AuthenticodeSignature $exe
          $sig | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($sig.Status -ne 'Valid') { throw "Signature is $($sig.Status): $($sig.StatusMessage)" }
          if ($sig.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
            throw "Unexpected signer: $($sig.SignerCertificate.Subject)"
          }
          if (-not $sig.TimeStamperCertificate) { throw "The signature has no timestamp" }
          $p = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "termSwitch --version exited $($p.ExitCode)" }

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/termSwitch-windows-x64.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termSwitch-windows-x64.exe
          path: dist/termSwitch-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [version, build, verify-windows]
    # With signing on, a release is published only if the signed Windows build
    # verified. With signing off, verify-windows is skipped and the unsigned
    # build is published as before.
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.version.result == 'success' && needs.build.result == 'success' &&
      (needs.verify-windows.result == 'success' ||
       (vars.SIGNPATH_ORGANIZATION_ID == '' && needs.verify-windows.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          pattern: termSwitch-*      # never the unsigned- or signed- staging copies
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: |
          sha256sum termSwitch-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Remove the old "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SIGNED: ${{ needs.verify-windows.result == 'success' }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            windows="Windows: signed by SignPath Foundation. Free code signing provided by SignPath.io, certificate by SignPath Foundation."
          else
            windows="Windows: not code-signed."
          fi
          notes="$windows
          macOS: not code-signed. See the README for first-launch steps.
          Verify any download against SHA256SUMS.txt."
          gh release create "v${VERSION}" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "termSwitch v${VERSION}" \
            --notes "$notes" \
            --generate-notes \
            --latest
