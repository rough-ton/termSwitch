name: Branch cleanup

# Deletes a PR's branch when the PR is closed, whether it was merged or not.
# Run it by hand (Actions > Branch cleanup > Run workflow) to sweep up
# branches whose PRs were closed before this workflow existed.
#
# Never deletes the default branch, branches from forks, or a branch that
# still has another open PR.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  closed-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          open=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}" --jq 'length')
          if [ "$open" != "0" ]; then
            echo "Branch $BRANCH still has an open PR; keeping it."
            exit 0
          fi
          if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Deleted $BRANCH (PR #$PR closed)."
          else
            echo "Branch $BRANCH was already deleted."
          fi

  sweep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches whose PRs are all closed
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' |
          while read -r branch; do
            [ "$branch" = "$DEFAULT" ] && continue
            prs=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}:${branch}" \
                  --jq '[.[] | .state] | join(",")')
            if [ -z "$prs" ]; then
              echo "keep    $branch (no PR yet)"
            elif echo "$prs" | grep -q open; then
              echo "keep    $branch (open PR)"
            else
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/${branch}" >/dev/null \
                && echo "deleted $branch"
            fi
          done
